<style>
/* 970x250 at 1x: 1cqi = 9.7px. Two columns: logo and message on the left, call to action on the right. */
.pg-frame[data-archetype="banner/billboard"] .pg-safe { flex-direction: row; align-items: center; gap: 4cqi; }
.pg-frame[data-archetype="banner/billboard"] .pg-main { display: flex; flex-direction: column; justify-content: center; gap: 1.6cqi; flex: 1 1 auto; min-width: 0; align-self: stretch; }
.pg-frame[data-archetype="banner/billboard"] .pg-logo { flex: 0 0 auto; gap: 0.8cqi; }
.pg-frame[data-archetype="banner/billboard"] .pg-logo img[data-slot="logo"] { height: 3cqi; }
.pg-frame[data-archetype="banner/billboard"] .pg-logo [data-slot="wordmark"] { font-size: 2.4cqi; }
.pg-frame[data-archetype="banner/billboard"] .pg-text { display: flex; flex-direction: column; gap: 1cqi; min-width: 0; max-width: 72cqi; }
.pg-frame[data-archetype="banner/billboard"] [data-slot="headline"] { font-size: 4.4cqi; text-wrap: balance; overflow-wrap: break-word; }
.pg-frame[data-archetype="banner/billboard"] [data-slot="sub"] { font-size: 1.9cqi; }
.pg-frame[data-archetype="banner/billboard"] [data-slot="cta"] { font-size: 1.6cqi; width: fit-content; flex: 0 0 auto; white-space: nowrap; }
.pg-frame[data-archetype="banner/billboard"][data-cta="chip"] [data-slot="cta"] { background: var(--pg-accent); color: var(--pg-accent-on); padding: 1.1cqi 1.8cqi; border-radius: var(--brand-radius); }
.pg-frame[data-archetype="banner/billboard"][data-cta="text"] [data-slot="cta"] { color: var(--pg-on-surface); text-decoration: underline; text-decoration-color: var(--pg-accent); text-decoration-thickness: 0.2cqi; text-underline-offset: 0.2cqi; }
</style>
<div class="pg-frame" data-archetype="banner/billboard">
  <div class="pg-safe">
    <div class="pg-main">
      <div class="pg-logo"><img data-slot="logo" alt=""><span data-slot="wordmark" data-slot-optional></span></div>
      <div class="pg-text">
        <div class="pg-h2" data-slot="headline"></div>
        <div class="pg-body" data-slot="sub" data-slot-optional></div>
      </div>
    </div>
    <div class="pg-label" data-slot="cta"></div>
  </div>
</div>
