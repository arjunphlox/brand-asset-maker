<style>
/* 1920x600 at 1x: 1cqi = 19.2px. The safe zone is the central 1280px; the block sits on the centre line. */
.pg-frame[data-archetype="banner/hero"] .pg-safe { justify-content: center; }
.pg-frame[data-archetype="banner/hero"] .pg-logo img[data-slot="logo"] { height: 2.6cqi; }
.pg-frame[data-archetype="banner/hero"] .pg-logo [data-slot="wordmark"] { font-size: 1.6cqi; }
.pg-frame[data-archetype="banner/hero"] .pg-text { display: flex; flex-direction: column; align-items: flex-start; text-align: start; gap: 1cqi; max-width: 46cqi; }
.pg-frame[data-archetype="banner/hero"][data-align="center"] .pg-text { align-self: center; align-items: center; text-align: center; }
.pg-frame[data-archetype="banner/hero"][data-align="center"] .pg-logo { left: 50%; transform: translateX(-50%); }
.pg-frame[data-archetype="banner/hero"] [data-slot="eyebrow"] { font-size: 1.15cqi; color: var(--pg-accent-text); }
.pg-frame[data-archetype="banner/hero"] [data-slot="headline"] { font-size: 3.6cqi; text-wrap: balance; overflow-wrap: break-word; max-width: 100%; }
.pg-frame[data-archetype="banner/hero"] [data-slot="body"] { font-size: 1.25cqi; max-width: 38cqi; }
.pg-frame[data-archetype="banner/hero"] [data-slot="cta"] { margin-top: 0.6cqi; }
.pg-frame[data-archetype="banner/hero"] [data-slot="cta"] { font-size: 1.1cqi; width: fit-content; flex: 0 0 auto; white-space: nowrap; }
.pg-frame[data-archetype="banner/hero"][data-cta="chip"] [data-slot="cta"] { background: var(--pg-accent); color: var(--pg-accent-on); padding: 0.8cqi 1.4cqi; border-radius: var(--brand-radius); }
.pg-frame[data-archetype="banner/hero"][data-cta="text"] [data-slot="cta"] { color: var(--pg-on-surface); text-decoration: underline; text-decoration-color: var(--pg-accent); text-decoration-thickness: 0.12cqi; text-underline-offset: 0.12cqi; }
</style>
<div class="pg-frame" data-archetype="banner/hero">
  <div class="pg-safe">
    <div class="pg-logo pg-logo--tl"><img data-slot="logo" alt=""><span data-slot="wordmark" data-slot-optional></span></div>
    <div class="pg-text">
      <div class="pg-label" data-slot="eyebrow" data-slot-optional></div>
      <div class="pg-h1" data-slot="headline"></div>
      <div class="pg-body" data-slot="body" data-slot-optional></div>
      <div class="pg-label" data-slot="cta"></div>
    </div>
  </div>
</div>
