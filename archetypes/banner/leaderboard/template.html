<style>
/* 728x90 at 1x: 1cqi = 7.28px. One row inside a 74px-tall safe zone: logo, text, call to action. */
.pg-frame[data-archetype="banner/leaderboard"] .pg-safe { flex-direction: row; align-items: center; gap: 2.2cqi; }
.pg-frame[data-archetype="banner/leaderboard"] .pg-logo { flex: 0 0 auto; gap: 0.8cqi; }
.pg-frame[data-archetype="banner/leaderboard"] .pg-logo img[data-slot="logo"] { height: 5.4cqi; }
.pg-frame[data-archetype="banner/leaderboard"] .pg-logo [data-slot="wordmark"] { font-size: 2.6cqi; }
.pg-frame[data-archetype="banner/leaderboard"] .pg-text { display: flex; flex-direction: column; gap: 0.6cqi; flex: 1 1 auto; min-width: 0; }
.pg-frame[data-archetype="banner/leaderboard"] [data-slot="headline"] { font-size: 3.3cqi; text-wrap: balance; overflow-wrap: break-word; }
.pg-frame[data-archetype="banner/leaderboard"] [data-slot="sub"] { font-size: 1.8cqi; color: var(--pg-on-surface); }
.pg-frame[data-archetype="banner/leaderboard"] [data-slot="cta"] { font-size: 1.75cqi; width: fit-content; flex: 0 0 auto; white-space: nowrap; }
.pg-frame[data-archetype="banner/leaderboard"][data-cta="chip"] [data-slot="cta"] { background: var(--pg-accent); color: var(--pg-accent-on); padding: 1.1cqi 1.6cqi; border-radius: var(--brand-radius); }
.pg-frame[data-archetype="banner/leaderboard"][data-cta="text"] [data-slot="cta"] { color: var(--pg-on-surface); text-decoration: underline; text-decoration-color: var(--pg-accent); text-decoration-thickness: 0.2cqi; text-underline-offset: 0.2cqi; }
</style>
<div class="pg-frame" data-archetype="banner/leaderboard">
  <div class="pg-safe">
    <div class="pg-logo"><img data-slot="logo" alt=""><span data-slot="wordmark" data-slot-optional></span></div>
    <div class="pg-text">
      <div class="pg-h3" data-slot="headline"></div>
      <div class="pg-body" data-slot="sub" data-slot-optional></div>
    </div>
    <div class="pg-label" data-slot="cta"></div>
  </div>
</div>
