<style>
/* 320x100 at 1x: 1cqi = 3.2px. One row inside 296x84: the mark, the headline, the call to action. */
.pg-frame[data-archetype="banner/mobile"] .pg-safe { flex-direction: row; align-items: center; gap: 3.5cqi; }
.pg-frame[data-archetype="banner/mobile"] .pg-logo { flex: 0 0 auto; }
.pg-frame[data-archetype="banner/mobile"] .pg-logo img[data-slot="logo"] { height: 9cqi; }
.pg-frame[data-archetype="banner/mobile"] [data-slot="headline"] { font-size: 5.4cqi; flex: 1 1 auto; min-width: 0; text-wrap: balance; overflow-wrap: break-word; }
.pg-frame[data-archetype="banner/mobile"] [data-slot="cta"] { font-size: 3.9cqi; width: fit-content; flex: 0 0 auto; white-space: nowrap; }
.pg-frame[data-archetype="banner/mobile"][data-cta="chip"] [data-slot="cta"] { background: var(--pg-accent); color: var(--pg-accent-on); padding: 2.2cqi 3cqi; border-radius: var(--brand-radius); }
.pg-frame[data-archetype="banner/mobile"][data-cta="text"] [data-slot="cta"] { color: var(--pg-on-surface); text-decoration: underline; text-decoration-color: var(--pg-accent); text-decoration-thickness: 0.4cqi; text-underline-offset: 0.4cqi; }
</style>
<div class="pg-frame" data-archetype="banner/mobile">
  <div class="pg-safe">
    <div class="pg-logo"><img data-slot="logo" alt=""></div>
    <div class="pg-h3" data-slot="headline"></div>
    <div class="pg-label" data-slot="cta"></div>
  </div>
</div>
