<style>
/* 160x600 at 1x: 1cqi = 1.6px. A 136px column: logo on top, message in the middle, call to action at the foot. */
.pg-frame[data-archetype="banner/skyscraper"] .pg-safe { gap: 8cqi; }
.pg-frame[data-archetype="banner/skyscraper"] .pg-logo { flex: 0 0 auto; gap: 3cqi; }
.pg-frame[data-archetype="banner/skyscraper"] .pg-logo img[data-slot="logo"] { height: 15cqi; }
.pg-frame[data-archetype="banner/skyscraper"] .pg-logo [data-slot="wordmark"] { font-size: 9cqi; }
.pg-frame[data-archetype="banner/skyscraper"] .pg-text { display: flex; flex-direction: column; justify-content: center; gap: 8cqi; flex: 1 1 auto; min-height: 0; }
.pg-frame[data-archetype="banner/skyscraper"] [data-slot="headline"] { font-size: 13cqi; text-wrap: balance; overflow-wrap: break-word; }
.pg-frame[data-archetype="banner/skyscraper"] [data-slot="sub"] { font-size: 8cqi; }
.pg-frame[data-archetype="banner/skyscraper"] [data-slot="cta"] { font-size: 7.6cqi; width: fit-content; flex: 0 0 auto; white-space: nowrap; }
.pg-frame[data-archetype="banner/skyscraper"][data-cta="chip"] [data-slot="cta"] { background: var(--pg-accent); color: var(--pg-accent-on); padding: 4cqi 5cqi; border-radius: var(--brand-radius); }
.pg-frame[data-archetype="banner/skyscraper"][data-cta="text"] [data-slot="cta"] { color: var(--pg-on-surface); text-decoration: underline; text-decoration-color: var(--pg-accent); text-decoration-thickness: 1cqi; text-underline-offset: 1cqi; }
</style>
<div class="pg-frame" data-archetype="banner/skyscraper">
  <div class="pg-safe">
    <div class="pg-logo"><img data-slot="logo" alt=""><span data-slot="wordmark" data-slot-optional></span></div>
    <div class="pg-text">
      <div class="pg-h3" data-slot="headline"></div>
      <div class="pg-body" data-slot="sub" data-slot-optional></div>
    </div>
    <div class="pg-label" data-slot="cta"></div>
  </div>
</div>
