<style>
/* Business card back, 85x55mm at 150 dpi (502x325, 1cqi = 5.02px). Who, then how to reach them. Body text is 3.6cqi:
   18px, above the 17px (8pt) floor. */
.pg-frame[data-archetype="print/card-back"] .pg-safe { justify-content: flex-end; }
.pg-frame[data-archetype="print/card-back"] .pg-logo { position: absolute; top: 0; right: 0; }
.pg-frame[data-archetype="print/card-back"][data-align="center"] .pg-logo { right: auto; left: 50%; transform: translateX(-50%); }
.pg-frame[data-archetype="print/card-back"] .pg-logo img[data-slot="logo"] { height: 7cqi; }
.pg-frame[data-archetype="print/card-back"] .pg-logo [data-slot="wordmark"] { font-size: 4.4cqi; }
.pg-frame[data-archetype="print/card-back"] .pg-block { display: flex; flex-direction: column; align-items: flex-start; text-align: start; min-width: 0; max-width: 100%; }
.pg-frame[data-archetype="print/card-back"][data-align="center"] .pg-block { align-items: center; text-align: center; }
.pg-frame[data-archetype="print/card-back"] [data-slot="name"] { font-size: 6.4cqi; line-height: 1.02; overflow-wrap: break-word; max-width: 100%; }
.pg-frame[data-archetype="print/card-back"] [data-slot="role"] { font-size: 3.6cqi; margin-top: 1.2cqi; max-width: 100%; }
.pg-frame[data-archetype="print/card-back"] .pg-contacts { display: flex; flex-direction: column; align-items: inherit; gap: 0.6cqi; margin-top: 4.4cqi; max-width: 100%; min-width: 0; }
.pg-frame[data-archetype="print/card-back"] .pg-contacts:not(:has([data-slot])) { display: none; }
.pg-frame[data-archetype="print/card-back"] .pg-contacts .pg-body { font-size: 3.6cqi; max-width: 100%; overflow-wrap: anywhere; }
</style>
<div class="pg-frame" data-archetype="print/card-back">
  <div class="pg-safe">
    <div class="pg-logo"><img data-slot="logo" alt=""><span data-slot="wordmark" data-slot-optional></span></div>
    <div class="pg-block">
      <div class="pg-h2" data-slot="name"></div>
      <div class="pg-body" data-slot="role" data-slot-optional></div>
      <div class="pg-contacts">
        <div class="pg-body" data-slot="contact1" data-slot-optional></div>
        <div class="pg-body" data-slot="contact2" data-slot-optional></div>
        <div class="pg-body" data-slot="contact3" data-slot-optional></div>
        <div class="pg-body" data-slot="contact4" data-slot-optional></div>
      </div>
    </div>
  </div>
</div>
