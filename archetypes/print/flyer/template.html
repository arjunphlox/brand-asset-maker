<style>
/* Print flyer, A4 (1cqi = 12.4px) or A5 (1cqi = 8.74px): the two share the proportion, so one set of cqi sizes serves both.
   The smallest text is the kicker at 2.2cqi: 19.2px at A5, above the 17px (8pt at 150 dpi) floor. */
.pg-frame[data-archetype="print/flyer"] .pg-safe { justify-content: space-between; }
.pg-frame[data-archetype="print/flyer"] .pg-top { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 3cqi; min-width: 0; }
.pg-frame[data-archetype="print/flyer"] .pg-logo img[data-slot="logo"] { height: 6cqi; }
.pg-frame[data-archetype="print/flyer"] .pg-logo [data-slot="wordmark"] { font-size: 6.4cqi; }
.pg-frame[data-archetype="print/flyer"] [data-slot="kicker"] { font-size: 2.2cqi; text-align: end; min-width: 0; max-width: 50%; }
.pg-frame[data-archetype="print/flyer"] .pg-block { display: flex; flex-direction: column; align-items: flex-start; text-align: start; min-width: 0; max-width: 100%; }
.pg-frame[data-archetype="print/flyer"][data-align="center"] .pg-block { align-items: center; text-align: center; }
.pg-frame[data-archetype="print/flyer"] [data-slot="headline"] { font-size: 10cqi; text-wrap: balance; overflow-wrap: break-word; max-width: 100%; }
.pg-frame[data-archetype="print/flyer"][data-size="large"] [data-slot="headline"] { font-size: 12.5cqi; }
/* The facts: date and place as one block on an accent rule (a bar at the start side; a short rule above when centred). */
.pg-frame[data-archetype="print/flyer"] .pg-facts { display: flex; flex-direction: row; align-items: stretch; gap: 2.4cqi; margin-top: 5.6cqi; max-width: 100%; min-width: 0; }
.pg-frame[data-archetype="print/flyer"] .pg-facts .pg-bar { width: 0.8cqi; flex: 0 0 auto; }
.pg-frame[data-archetype="print/flyer"] .pg-facts-text { display: flex; flex-direction: column; gap: 1.2cqi; min-width: 0; }
.pg-frame[data-archetype="print/flyer"][data-align="center"] .pg-facts { flex-direction: column; align-items: center; gap: 2.4cqi; }
.pg-frame[data-archetype="print/flyer"][data-align="center"] .pg-facts .pg-bar { width: 12cqi; height: 0.8cqi; }
.pg-frame[data-archetype="print/flyer"] [data-slot="date"], .pg-frame[data-archetype="print/flyer"] [data-slot="place"] { font-size: 5cqi; line-height: 1.02; overflow-wrap: break-word; max-width: 100%; }
.pg-frame[data-archetype="print/flyer"] [data-slot="body"] { font-size: 2.6cqi; margin-top: 4.4cqi; max-width: 80%; }
.pg-frame[data-archetype="print/flyer"] [data-slot="cta"] { font-size: 2.4cqi; margin-top: 4.4cqi; }
</style>
<div class="pg-frame" data-archetype="print/flyer">
  <div class="pg-safe">
    <div class="pg-top">
      <div class="pg-logo"><img data-slot="logo" alt=""><span data-slot="wordmark" data-slot-optional></span></div>
      <div class="pg-label" data-slot="kicker" data-slot-optional></div>
    </div>
    <div class="pg-block">
      <div class="pg-h1" data-slot="headline"></div>
      <div class="pg-facts">
        <div class="pg-bar" aria-hidden="true"></div>
        <div class="pg-facts-text"><div class="pg-h3" data-slot="date"></div><div class="pg-h3" data-slot="place"></div></div>
      </div>
      <div class="pg-body" data-slot="body"></div>
      <div class="pg-label" data-slot="cta" data-slot-optional></div>
    </div>
  </div>
</div>
