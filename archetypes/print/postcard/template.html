<style>
/* Postcard picture side, A6 landscape 148x105mm at 150 dpi (874x620, 1cqi = 8.74px). The logo at the head, the block on
   the foot of the safe zone. The kicker is 2.2cqi: 19.2px, above the 17px (8pt) floor. */
.pg-frame[data-archetype="print/postcard"] .pg-safe { justify-content: flex-end; }
.pg-frame[data-archetype="print/postcard"] .pg-logo img[data-slot="logo"] { height: 6cqi; }
.pg-frame[data-archetype="print/postcard"] .pg-logo [data-slot="wordmark"] { font-size: 6cqi; }
.pg-frame[data-archetype="print/postcard"][data-align="center"] .pg-logo { left: 50%; transform: translateX(-50%); }
.pg-frame[data-archetype="print/postcard"] .pg-block { display: flex; flex-direction: column; align-items: flex-start; text-align: start; min-width: 0; max-width: 100%; }
.pg-frame[data-archetype="print/postcard"][data-align="center"] .pg-block { align-items: center; text-align: center; }
.pg-frame[data-archetype="print/postcard"] [data-slot="kicker"] { font-size: 2.2cqi; color: var(--pg-accent-text); margin-bottom: 2.4cqi; }
.pg-frame[data-archetype="print/postcard"] [data-slot="headline"] { font-size: 7.5cqi; text-wrap: balance; overflow-wrap: break-word; max-width: 100%; }
.pg-frame[data-archetype="print/postcard"] [data-slot="body"] { font-size: 2.4cqi; margin-top: 3cqi; max-width: 72%; }
</style>
<div class="pg-frame" data-archetype="print/postcard">
  <div class="pg-safe">
    <div class="pg-logo pg-logo--tl"><img data-slot="logo" alt=""><span data-slot="wordmark" data-slot-optional></span></div>
    <div class="pg-block">
      <div class="pg-label" data-slot="kicker" data-slot-optional></div>
      <div class="pg-h1" data-slot="headline"></div>
      <div class="pg-body" data-slot="body" data-slot-optional></div>
    </div>
  </div>
</div>
