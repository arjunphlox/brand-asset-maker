<style>
/* Sticker, 3x3in at 150 dpi (450x450, 1cqi = 4.5px). The surface is carried by the disc, so the circle option is the
   disc with a full radius and a transparent frame around it (the die cut). In the circle the group is held to 64% of the
   frame, so its corners stay inside the cut. */
.pg-frame[data-archetype="print/sticker"] .pg-disc { position: absolute; inset: 0; background: var(--pg-surface); }
.pg-frame[data-archetype="print/sticker"][data-shape="circle"] { background: transparent; }
.pg-frame[data-archetype="print/sticker"][data-shape="circle"] .pg-disc { border-radius: 50%; }
.pg-frame[data-archetype="print/sticker"] .pg-safe { justify-content: center; align-items: center; text-align: center; }
.pg-frame[data-archetype="print/sticker"] .pg-group { display: flex; flex-direction: column; align-items: center; gap: 4cqi; max-width: 100%; min-width: 0; }
.pg-frame[data-archetype="print/sticker"][data-shape="circle"] .pg-group { max-width: 64%; }
.pg-frame[data-archetype="print/sticker"] .pg-logo { gap: 3cqi; flex-wrap: wrap; justify-content: center; }
.pg-frame[data-archetype="print/sticker"] .pg-logo img[data-slot="logo"] { height: 22cqi; }
.pg-frame[data-archetype="print/sticker"] .pg-group:has([data-slot="word"]) .pg-logo img[data-slot="logo"] { height: 14cqi; }
.pg-frame[data-archetype="print/sticker"] .pg-logo [data-slot="wordmark"] { font-size: 9cqi; }
.pg-frame[data-archetype="print/sticker"] [data-slot="word"] { font-size: 11cqi; line-height: 1; text-wrap: balance; overflow-wrap: anywhere; max-width: 100%; }
</style>
<div class="pg-frame" data-archetype="print/sticker">
  <div class="pg-disc">
    <div class="pg-safe">
      <div class="pg-group">
        <div class="pg-logo"><img data-slot="logo" alt=""><span data-slot="wordmark" data-slot-optional></span></div>
        <div class="pg-h1" data-slot="word" data-slot-optional></div>
      </div>
    </div>
  </div>
</div>
