<style>
/* 1920x1080: 1cqi = 19.2px. The logo, footer and page number are the shared slide chrome (base.css); this layout styles only its content box. */
.pg-frame[data-archetype="slides/bullets"] .pg-slide-body { gap: 3.2cqi; }
.pg-frame[data-archetype="slides/bullets"] [data-slot="title"] { font-size: 4cqi; line-height: 1; max-width: 84cqi; text-wrap: balance; overflow-wrap: break-word; }
.pg-frame[data-archetype="slides/bullets"] .pg-points { display: flex; flex-direction: column; gap: 1.6cqi; max-width: 84cqi; min-width: 0; }
.pg-frame[data-archetype="slides/bullets"] .pg-point { display: flex; flex-direction: row; align-items: baseline; gap: 1.6cqi; min-width: 0; }
.pg-frame[data-archetype="slides/bullets"] .pg-point:not(:has([data-slot])) { display: none; }
.pg-frame[data-archetype="slides/bullets"] .pg-mark { flex: 0 0 auto; width: 0.8cqi; height: 0.8cqi; background: var(--pg-accent); border-radius: var(--brand-radius); }
.pg-frame[data-archetype="slides/bullets"] .pg-point [data-slot] { font-size: 2.1cqi; min-width: 0; flex: 1 1 auto; overflow-wrap: break-word; }
</style>
<div class="pg-frame" data-archetype="slides/bullets">
  <div class="pg-safe">
    <div class="pg-logo pg-logo--tl"><img data-slot="logo" alt=""><span data-slot="wordmark" data-slot-optional></span></div>
    <div class="pg-slide-body">
      <div class="pg-h2" data-slot="title"></div>
      <div class="pg-points">
        <div class="pg-point"><span class="pg-mark" aria-hidden="true"></span><div class="pg-body" data-slot="point1"></div></div>
        <div class="pg-point"><span class="pg-mark" aria-hidden="true"></span><div class="pg-body" data-slot="point2"></div></div>
        <div class="pg-point"><span class="pg-mark" aria-hidden="true"></span><div class="pg-body" data-slot="point3"></div></div>
        <div class="pg-point"><span class="pg-mark" aria-hidden="true"></span><div class="pg-body" data-slot="point4" data-slot-optional></div></div>
        <div class="pg-point"><span class="pg-mark" aria-hidden="true"></span><div class="pg-body" data-slot="point5" data-slot-optional></div></div>
      </div>
    </div>
    <div class="pg-slide-foot"><div class="pg-label" data-slot="footer" data-slot-optional></div><div class="pg-label" data-slot="page" data-slot-optional></div></div>
  </div>
</div>
