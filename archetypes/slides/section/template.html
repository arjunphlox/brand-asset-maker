<style>
/* 1920x1080: 1cqi = 19.2px. The logo, footer and page number are the shared slide chrome (base.css); this layout styles only its content box. */
.pg-frame[data-archetype="slides/section"] .pg-block { display: flex; flex-direction: column; align-items: flex-start; gap: 2cqi; max-width: 80cqi; min-width: 0; }
.pg-frame[data-archetype="slides/section"] [data-slot="number"] { font-size: 9cqi; line-height: 0.9; color: var(--pg-accent-text); }
.pg-frame[data-archetype="slides/section"] [data-slot="title"] { font-size: 6cqi; line-height: 1; text-wrap: balance; overflow-wrap: break-word; max-width: 100%; }
.pg-frame[data-archetype="slides/section"] [data-slot="kicker"] { color: var(--pg-muted); }
</style>
<div class="pg-frame" data-archetype="slides/section">
  <div class="pg-safe">
    <div class="pg-logo pg-logo--tl"><img data-slot="logo" alt=""><span data-slot="wordmark" data-slot-optional></span></div>
    <div class="pg-slide-body">
      <div class="pg-block">
        <div class="pg-data" data-slot="number"></div>
        <div class="pg-h1" data-slot="title"></div>
        <div class="pg-label" data-slot="kicker" data-slot-optional></div>
      </div>
    </div>
    <div class="pg-slide-foot"><div class="pg-label" data-slot="footer" data-slot-optional></div><div class="pg-label" data-slot="page" data-slot-optional></div></div>
  </div>
</div>
