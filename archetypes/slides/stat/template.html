<style>
/* 1920x1080: 1cqi = 19.2px. The logo, footer and page number are the shared slide chrome (base.css); this layout styles only its content box. */
.pg-frame[data-archetype="slides/stat"] .pg-block { display: flex; flex-direction: column; min-width: 0; max-width: 84cqi; }
/* Descender room for a unit such as "250 g": the sanctioned stat fix (rules/decisions.md 2026-10-20). */
.pg-frame[data-archetype="slides/stat"] [data-slot="number"] { font-size: 16cqi; line-height: 0.85; padding-bottom: 0.15em; }
.pg-frame[data-archetype="slides/stat"][data-accent="number"] [data-slot="number"] { color: var(--pg-accent-text); }
.pg-frame[data-archetype="slides/stat"] [data-slot="label"] { font-size: 2.8cqi; margin-top: 1.6cqi; max-width: 64cqi; text-wrap: balance; }
.pg-frame[data-archetype="slides/stat"] [data-slot="source"] { color: var(--pg-muted); margin-top: 2cqi; }
</style>
<div class="pg-frame" data-archetype="slides/stat">
  <div class="pg-safe">
    <div class="pg-logo pg-logo--tl"><img data-slot="logo" alt=""><span data-slot="wordmark" data-slot-optional></span></div>
    <div class="pg-slide-body">
      <div class="pg-block">
        <div class="pg-data" data-slot="number"></div>
        <div class="pg-body" data-slot="label"></div>
        <div class="pg-label" data-slot="source" data-slot-optional></div>
      </div>
    </div>
    <div class="pg-slide-foot"><div class="pg-label" data-slot="footer" data-slot-optional></div><div class="pg-label" data-slot="page" data-slot-optional></div></div>
  </div>
</div>
