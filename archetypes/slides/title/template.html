<style>
/* 1920x1080: 1cqi = 19.2px. The logo, footer and page number are the shared slide chrome (base.css); this layout styles only its content box. */
.pg-frame[data-archetype="slides/title"] .pg-slide-body { justify-content: flex-end; padding-bottom: 2cqi; }
.pg-frame[data-archetype="slides/title"] .pg-block { display: flex; flex-direction: column; align-items: flex-start; gap: 1.6cqi; max-width: 80cqi; min-width: 0; }
.pg-frame[data-archetype="slides/title"] [data-slot="kicker"] { color: var(--pg-accent-text); }
.pg-frame[data-archetype="slides/title"] [data-slot="title"] { font-size: 6.2cqi; line-height: 0.98; text-wrap: balance; overflow-wrap: break-word; max-width: 100%; }
.pg-frame[data-archetype="slides/title"] [data-slot="subtitle"] { font-size: 2.2cqi; max-width: 62cqi; text-wrap: pretty; }
.pg-frame[data-archetype="slides/title"][data-align="center"] .pg-slide-body { justify-content: center; align-items: center; padding-bottom: 0; }
.pg-frame[data-archetype="slides/title"][data-align="center"] .pg-block { align-items: center; text-align: center; }
</style>
<div class="pg-frame" data-archetype="slides/title">
  <div class="pg-safe">
    <div class="pg-logo pg-logo--tl"><img data-slot="logo" alt=""><span data-slot="wordmark" data-slot-optional></span></div>
    <div class="pg-slide-body">
      <div class="pg-block">
        <div class="pg-label" data-slot="kicker" data-slot-optional></div>
        <div class="pg-h1" data-slot="title"></div>
        <div class="pg-body" data-slot="subtitle" data-slot-optional></div>
      </div>
    </div>
    <div class="pg-slide-foot"><div class="pg-label" data-slot="footer" data-slot-optional></div><div class="pg-label" data-slot="page" data-slot-optional></div></div>
  </div>
</div>
