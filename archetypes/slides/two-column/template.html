<style>
/* 1920x1080: 1cqi = 19.2px. The logo, footer and page number are the shared slide chrome (base.css); this layout styles only its content box. */
.pg-frame[data-archetype="slides/two-column"] .pg-slide-body { gap: 3.6cqi; }
.pg-frame[data-archetype="slides/two-column"] [data-slot="title"] { font-size: 3.6cqi; line-height: 1; max-width: 84cqi; text-wrap: balance; overflow-wrap: break-word; }
.pg-frame[data-archetype="slides/two-column"] .pg-cols { display: grid; grid-template-columns: 1fr 1fr; column-gap: 6cqi; min-width: 0; }
.pg-frame[data-archetype="slides/two-column"] .pg-col { display: flex; flex-direction: column; gap: 1.4cqi; padding-top: 1.4cqi; border-top: 0.15cqi solid var(--pg-muted); min-width: 0; }
.pg-frame[data-archetype="slides/two-column"] .pg-col .pg-label { color: var(--pg-accent-text); }
.pg-frame[data-archetype="slides/two-column"] .pg-col .pg-body { font-size: 2cqi; overflow-wrap: break-word; text-wrap: pretty; }
</style>
<div class="pg-frame" data-archetype="slides/two-column">
  <div class="pg-safe">
    <div class="pg-logo pg-logo--tl"><img data-slot="logo" alt=""><span data-slot="wordmark" data-slot-optional></span></div>
    <div class="pg-slide-body">
      <div class="pg-h2" data-slot="title"></div>
      <div class="pg-cols">
        <div class="pg-col"><div class="pg-label" data-slot="leftLabel"></div><div class="pg-body" data-slot="left"></div></div>
        <div class="pg-col"><div class="pg-label" data-slot="rightLabel"></div><div class="pg-body" data-slot="right"></div></div>
      </div>
    </div>
    <div class="pg-slide-foot"><div class="pg-label" data-slot="footer" data-slot-optional></div><div class="pg-label" data-slot="page" data-slot-optional></div></div>
  </div>
</div>
