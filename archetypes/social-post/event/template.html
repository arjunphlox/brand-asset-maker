<style>
.pg-frame[data-archetype="social-post/event"] .pg-safe { justify-content: flex-end; }
/* Top row: the logo, and with rule="hairline" a hairline running from it to the far edge of the safe zone. */
.pg-frame[data-archetype="social-post/event"] .pg-top { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-direction: row; align-items: center; gap: 2.4cqi; }
.pg-frame[data-archetype="social-post/event"][data-align="center"][data-rule="none"] .pg-top { justify-content: center; }
.pg-frame[data-archetype="social-post/event"] .pg-rule { display: none; flex: 1 1 auto; height: 0.2cqi; background: var(--pg-muted); }
.pg-frame[data-archetype="social-post/event"][data-rule="hairline"] .pg-rule { display: block; }
.pg-frame[data-archetype="social-post/event"] .pg-block { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; max-width: 100%; text-align: start; }
.pg-frame[data-archetype="social-post/event"][data-align="center"] .pg-block { align-items: center; text-align: center; }
.pg-frame[data-archetype="social-post/event"] [data-slot="name"] { font-size: calc(11cqi * var(--pg-title, 1)); text-wrap: balance; overflow-wrap: break-word; max-width: 100%; }
/* highlight="block": the name sits on solid accent tags, one per line (box-decoration-break: clone repeats the padding and
   radius on every line; padding 0.08em by 0.22em of the tag size, written in cqi). The wrapper is display: contents by default, so the default layout is unchanged; with block it is
   the line's block box, and the slot turns inline inside it. line-height opens to 1.62 so tags on consecutive lines do not touch. */
.pg-frame[data-archetype="social-post/event"] .pg-title { display: contents; }
.pg-frame[data-archetype="social-post/event"][data-highlight="block"] .pg-title { display: block; max-width: 100%; font-size: 9.6cqi; line-height: 1.62; text-wrap: balance; }
.pg-frame[data-archetype="social-post/event"][data-highlight="block"][data-align="center"] .pg-title { text-align: center; }
.pg-frame[data-archetype="social-post/event"][data-highlight="block"] [data-slot="name"] { display: inline; font-size: calc(9.6cqi * var(--pg-title, 1)); line-height: 1.62; background: var(--pg-accent); color: var(--pg-accent-on); padding: 0.768cqi 2.112cqi; border-radius: var(--brand-radius); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
/* The date reads second: display face one step down, with room above it for the name's descenders. */
.pg-frame[data-archetype="social-post/event"] [data-slot="date"] { font-size: 7cqi; margin-top: 3.4cqi; max-width: 100%; }
.pg-frame[data-archetype="social-post/event"] [data-slot="place"] { font-size: 4.6cqi; margin-top: 1.6cqi; max-width: 100%; }
.pg-frame[data-archetype="social-post/event"] [data-slot="cta"] { margin-top: 4.4cqi; }
.pg-frame[data-archetype="social-post/event"][data-accent="date"] [data-slot="date"] { color: var(--pg-accent-text); }
.pg-frame[data-archetype="social-post/event"][data-accent="cta"] [data-slot="cta"] { color: var(--pg-accent-text); }
/* cta="pill": one solid button, the accent surface with its own text colour (on the accent scheme base.css swaps
   the pair, so the button turns ink with accent text). After the accent rule, so the pill's text colour wins. */
.pg-frame[data-archetype="social-post/event"][data-cta="pill"] [data-slot="cta"] { background: var(--pg-accent); color: var(--pg-accent-on); padding: 1.6cqi 2.8cqi; border-radius: var(--brand-radius); width: fit-content; }
/* A talk (optional slots, 2026-10-21): the series line sits in the top row, at the end side by default; with
   head="series" the row mirrors, so the series reads first at the start side and the logo moves to the end. The speaker
   and their role sit under the name. The wrappers are display: contents unless foot="split", so a post without these
   slots renders as before. A role without a speaker is dropped: it never stands alone. */
.pg-frame[data-archetype="social-post/event"] .pg-top:has([data-slot="series"]) { justify-content: space-between; }
.pg-frame[data-archetype="social-post/event"] [data-slot="series"] { margin-left: auto; text-align: end; min-width: 0; }
.pg-frame[data-archetype="social-post/event"][data-head="series"] .pg-top { flex-direction: row-reverse; }
.pg-frame[data-archetype="social-post/event"][data-head="series"] [data-slot="series"] { margin-left: 0; margin-right: auto; text-align: start; }
.pg-frame[data-archetype="social-post/event"] .pg-foot, .pg-frame[data-archetype="social-post/event"] .pg-who, .pg-frame[data-archetype="social-post/event"] .pg-when { display: contents; }
.pg-frame[data-archetype="social-post/event"] [data-slot="speaker"] { font-size: 6cqi; line-height: 1.02; margin-top: 3.4cqi; max-width: 100%; overflow-wrap: break-word; }
.pg-frame[data-archetype="social-post/event"] [data-slot="speakerRole"] { font-size: 4.2cqi; margin-top: 1cqi; max-width: 100%; }
.pg-frame[data-archetype="social-post/event"] .pg-who:not(:has([data-slot="speaker"])) [data-slot="speakerRole"] { display: none; }
/* foot="split": the speaker at the start side, the date and place at the end side, last baselines aligned at the foot
   of the block. Not at 9:16, where the story stacks (the row would crowd the centre line). */
.pg-frame[data-archetype="social-post/event"][data-foot="split"]:not([data-ratio="9:16"]) .pg-foot { display: flex; flex-direction: row; justify-content: space-between; align-items: last baseline; gap: 3cqi; align-self: stretch; margin-top: 4.4cqi; min-width: 0; }
.pg-frame[data-archetype="social-post/event"][data-foot="split"]:not([data-ratio="9:16"]) .pg-who { display: flex; flex-direction: column; align-items: flex-start; text-align: start; min-width: 0; flex: 0 1 auto; max-width: 60%; }
.pg-frame[data-archetype="social-post/event"][data-foot="split"]:not([data-ratio="9:16"]) .pg-when { display: flex; flex-direction: column; align-items: flex-end; text-align: end; min-width: 0; flex: 0 1 auto; max-width: 56%; margin-left: auto; }
.pg-frame[data-archetype="social-post/event"][data-foot="split"]:not([data-ratio="9:16"]) [data-slot="speaker"],
.pg-frame[data-archetype="social-post/event"][data-foot="split"]:not([data-ratio="9:16"]) [data-slot="date"] { margin-top: 0; }
.pg-frame[data-archetype="social-post/event"][data-foot="split"]:not([data-ratio="9:16"]) [data-slot="date"] { font-size: 5.2cqi; line-height: 1.02; }
.pg-frame[data-archetype="social-post/event"][data-foot="split"]:not([data-ratio="9:16"]) [data-slot="speakerRole"] { font-size: 3.8cqi; }
</style>
<div class="pg-frame" data-archetype="social-post/event">
  <div class="pg-safe">
    <div class="pg-top">
      <div class="pg-logo"><img data-slot="logo" alt=""><span data-slot="wordmark" data-slot-optional></span></div>
      <div class="pg-rule" aria-hidden="true"></div>
      <div class="pg-label" data-slot="series" data-slot-optional></div>
    </div>
    <div class="pg-block">
      <div class="pg-title"><div class="pg-h1" data-slot="name"></div></div>
      <div class="pg-foot">
        <div class="pg-who"><div class="pg-h3" data-slot="speaker" data-slot-optional></div><div class="pg-body" data-slot="speakerRole" data-slot-optional></div></div>
        <div class="pg-when"><div class="pg-h2" data-slot="date"></div><div class="pg-body" data-slot="place"></div></div>
      </div>
      <div class="pg-label" data-slot="cta" data-slot-optional></div>
    </div>
  </div>
</div>
