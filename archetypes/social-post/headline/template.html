<style>
.pg-frame[data-archetype="social-post/headline"] .pg-safe { justify-content: flex-end; }
.pg-frame[data-archetype="social-post/headline"][data-align="center"] .pg-safe { justify-content: center; }
.pg-frame[data-archetype="social-post/headline"] .pg-block { display: flex; flex-direction: row; align-items: stretch; gap: 2.4cqi; max-width: 100%; min-width: 0; }
.pg-frame[data-archetype="social-post/headline"] .pg-block-text { display: flex; flex-direction: column; gap: 2.4cqi; min-width: 0; flex: 1 1 auto; text-align: start; }
.pg-frame[data-archetype="social-post/headline"][data-align="center"] .pg-block { align-self: center; }
.pg-frame[data-archetype="social-post/headline"][data-align="center"] .pg-block-text { text-align: center; align-items: center; }
.pg-frame[data-archetype="social-post/headline"] .pg-bar { display: none; flex: 0 0 auto; }
.pg-frame[data-archetype="social-post/headline"][data-mark="bar"] .pg-bar { display: block; }
.pg-frame[data-archetype="social-post/headline"][data-align="center"] .pg-bar { display: none; } /* bar is a start-side device; centered blocks carry no bar (spec) */
.pg-frame[data-archetype="social-post/headline"] [data-slot="headline"] { text-wrap: balance; font-size: 12cqi; margin: 0; overflow-wrap: break-word; max-width: 100%; }
.pg-frame[data-archetype="social-post/headline"][data-size="2"] [data-slot="headline"] { font-size: 15cqi; }
.pg-frame[data-archetype="social-post/headline"] [data-slot="cta"] { color: var(--pg-accent-text); }
/* accent scheme: accent == on-surface, so the CTA stays legible */
.pg-frame[data-archetype="social-post/headline"][data-align="center"] .pg-logo { top: auto; left: 50%; bottom: 0; transform: translateX(-50%); }
/* 9:16 story (1.4): adapted, not scaled. Sizes stay in cqi (same width, same line length); the layout changes.
   The line sits on the story's centre line, the CTA drops to the foot of the safe zone where the thumb is, and a
   centred story keeps the logo at the top so the CTA owns the foot. */
.pg-frame[data-archetype="social-post/headline"][data-ratio="9:16"] .pg-safe { justify-content: center; }
.pg-frame[data-archetype="social-post/headline"][data-ratio="9:16"] [data-slot="cta"] { position: absolute; bottom: 0; left: 0; right: 0; }
.pg-frame[data-archetype="social-post/headline"][data-ratio="9:16"][data-align="center"] .pg-logo { top: 0; bottom: auto; }
</style>
<div class="pg-frame" data-archetype="social-post/headline">
  <div class="pg-safe">
    <div class="pg-logo pg-logo--tl"><img data-slot="logo" alt=""><span data-slot="wordmark" data-slot-optional></span></div>
    <div class="pg-block">
      <div class="pg-bar" aria-hidden="true"></div>
      <div class="pg-block-text">
        <div class="pg-label" data-slot="kicker" data-slot-optional></div>
        <div class="pg-h1" data-slot="headline"></div>
        <div class="pg-label" data-slot="cta" data-slot-optional></div>
      </div>
    </div>
  </div>
</div>
